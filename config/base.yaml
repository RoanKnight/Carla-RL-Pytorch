# CARLA client configuration
carla:
  host: localhost
  port: 2000
  timeout: 30.0

# Vehicle configuration
vehicle:
  model: vehicle.tesla.model3

# Observation configuration for RGB sensor for RL
observation:
  use_camera: true
  width: 84
  height: 84
  fov: 90

environment:
  route_sampling_resolution: 3.0
  route_progress_reached_distance_meters: 2.0
  destination_success_distance_meters: 2.0
  traffic_light_lookahead_waypoints: 25
  traffic_light_context_range_m: 75.0
  waypoint_distance_timeout_threshold_meters: 6.0
  waypoint_distance_timeout_steps: 200
  traffic_light_release_distance_meters: 2.0

lane_detection:
  max_lane_deviation: 5.0

# Vehicle control limits
control:
  max_forward_speed: 80.0

# Spectator camera configuration for test visualization
camera:
  distance_behind: 6.0
  height_above: 2.0
